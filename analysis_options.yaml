include: package:flutter_lints/flutter.yaml

# ---------------------------------------------------------------------------
# Elytron Dash2Board - política de análise estática
#
# Requisito do projeto: `flutter analyze` deve terminar com
# "No issues found!" e SEM nenhum aviso de deprecation.
# Por isso `deprecated_member_use` é promovido a ERROR.
#
# Regra de ouro de cor/opacidade neste repositório:
#   NUNCA use `Color.withOpacity(...)` (deprecated).
#   SEMPRE use `Color.withValues(alpha: ...)`.
# ---------------------------------------------------------------------------
analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    deprecated_member_use: error
    deprecated_member_use_from_same_package: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # functions/ e test/rules/ são projetos Node/TypeScript (npm), não Dart -
    # o `.dart` que aparece aqui é um template bundled dentro do pacote
    # firebase-tools (achado de teste manual, 04/09/2026: flutter analyze
    # passou a listar erros vindos de node_modules).
    - "**/node_modules/**"
    - functions/**
    - test/rules/**

linter:
  rules:
    always_declare_return_types: true
    avoid_print: true
    avoid_unused_constructor_parameters: true
    cancel_subscriptions: true
    close_sinks: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_final_locals: true
    prefer_single_quotes: true
    unawaited_futures: true
    use_super_parameters: true
