name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Análise e testes Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Formatação
        run: dart format --output=none --set-exit-if-changed lib test

      # A regra do projeto é "No issues found!". `--fatal-infos` garante que
      # até apontamento informativo derruba o build.
      - name: Análise estática
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Testes
        run: flutter test --reporter expanded

  guardrails:
    name: Regras inegociáveis do projeto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cada verificação abaixo é uma regra do CLAUDE.md. Se uma passar a
      # falhar, é porque alguém violou a regra - não porque o teste está ruim.
      - name: APIs proibidas
        run: |
          set -e
          fail=0
          check() {
            # ignora linhas de comentário: a regra é sobre código, não sobre doc
            n=$(grep -rn --include='*.dart' -F "$1" lib test 2>/dev/null \
                | grep -vE ':\s*(//|///)' | wc -l | tr -d ' ')
            if [ "$n" -ne 0 ]; then
              echo "::error::$2 encontrado em $n linha(s)"
              grep -rn --include='*.dart' -F "$1" lib test | grep -vE ':\s*(//|///)' || true
              fail=1
            else
              echo "ok: $2"
            fi
          }
          check "withOpacity"    "Color.withOpacity (use withValues(alpha:))"
          check "MaterialState"  "MaterialState* (use WidgetState*)"
          check "surfaceVariant" "ColorScheme.surfaceVariant"
          check "onBackground"   "ColorScheme.onBackground"
          check "StateNotifier"  "StateNotifier"
          check "AutoDispose"    "AutoDispose*Notifier"
          check "pumpAndSettle(" "pumpAndSettle (use pump(Duration))"
          exit $fail

      - name: Acento de marca fora dos gráficos
        run: |
          n=$(grep -rn "brandGreen\|brandCyan\|brandViolet" lib/core/widgets/charts/ 2>/dev/null | wc -l | tr -d ' ')
          if [ "$n" -ne 0 ]; then echo "::error::acento de marca usado em gráfico ($n)"; exit 1; fi
          echo "ok"

      - name: Firebase fora de presentation/
        run: |
          if grep -rln "cloud_firestore\|firebase_auth" lib/features/*/presentation lib/features/*/*/presentation 2>/dev/null | grep .; then
            echo "::error::presentation/ não pode importar Firebase"; exit 1
          fi
          echo "ok"

      - name: Segredos não versionados
        run: |
          set -e
          # android/app/google-services.json e ios/Runner/GoogleService-Info.plist
          # PODEM ser versionados desde 03/09/2026 (decisão do PO, ver
          # docs/20_RETOMADA_SESSAO.md): são chaves de cliente Firebase,
          # públicas por design, protegidas por security rules e App Check.
          for f in functions/.env; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::segredo versionado: $f"; exit 1
            fi
          done
          if git ls-files | grep -q "node_modules/"; then echo "::error::node_modules versionado"; exit 1; fi
          echo "ok"

  rules:
    name: Testes das security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # firebase-tools exige JDK 21+ para o emulador do Firestore; o Java
      # padrão do runner é mais antigo.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Rodar se existir
        run: |
          if [ -d test/rules ]; then
            cd test/rules && npm ci && npm test
          else
            echo "::warning::test/rules ainda não existe (achado A-02 da auditoria)"
          fi

  functions:
    # Cobertura mínima das Cloud Functions (docs/21_BACKLOG_ACHADOS_TECNICOS.md,
    # item 4): mesma dupla mocha + emulador já usada no job `rules`, mas
    # aqui chamando cada handler exportado direto contra Firestore/Auth
    # emulator - sem precisar do emulador de Functions.
    name: Testes das Cloud Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Dependências
        run: cd functions && npm ci
      - name: Análise estática
        run: cd functions && npm run lint
      - name: Testes
        run: cd functions && npm test

  build-android:
    # S2 (docs/21_BACKLOG_ACHADOS_TECNICOS.md, item 3): builda de verdade em
    # vez de só analisar/testar, para pegar erro de build nativo no PR. Usa
    # a assinatura de debug já configurada em android/app/build.gradle.kts
    # (não exige keystore nem secret de CI) - build "de simulação", não o
    # artefato assinado que a distribuição real vai exigir.
    name: Build Android (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dependências
        run: flutter pub get

      - name: Build APK debug
        run: flutter build apk --debug

  build-ios:
    # Mesmo racional do build-android, mas em runner macOS (obrigatório para
    # build iOS) e sem assinatura: `--no-codesign` valida a compilação do
    # projeto Xcode sem exigir certificado/provisioning profile como secret
    # de CI. Ver docs/22_INSIGHTS_BUILD_NATIVO.md para o caminho até um
    # build assinado de verdade.
    name: Build iOS (simulador, --no-codesign)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Build iOS para simulador
        run: flutter build ios --simulator --no-codesign
